# Top level is local development: `wrangler dev` and tests use it, everything runs
# on this machine, and secrets come from .dev.vars. Production lives in
# [env.production] and is only used with `--env production`.
name = "playden"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Placeholder id: it names the local database file and matches no real database,
# so a remote command without `--env production` fails instead of touching production.
[[d1_databases]]
binding = "DB"
database_name = "playden"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets are set with `wrangler secret put <NAME> --env production`.
[env.production]
name = "playden"

# Test-player sign-in is local only (D48). Pinned off here: every deploy resets it, and
# Cloudflare refuses a secret with the same name as this var.
[env.production.vars]
DEV_LOGIN = "false"

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[env.production.d1_databases]]
binding = "DB"
database_name = "playden"
database_id = "d5e5c1ce-9733-4dc4-9198-f406f7d925a7"
migrations_dir = "migrations"
